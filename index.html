<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>LEVEL UP</title>
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app-error" hidden class="app-error"></div>

  <header class="app-header">
    <h1 class="app-title">LEVEL <span class="accent">UP</span></h1>
    <div class="today-badge">
      <span id="today-date">--</span>
    </div>
  </header>

  <main class="dashboard">

    <section class="card stats-card">
      <div class="stat-row">
        <div class="stat-block">
          <span class="stat-label">Rank</span>
          <span id="current-rank" class="stat-value">--</span>
        </div>
        <div class="stat-block">
          <span class="stat-label">Total XP</span>
          <span id="total-xp" class="stat-value">0</span>
        </div>
        <div class="stat-block">
          <span class="stat-label">Today's XP</span>
          <span id="today-xp" class="stat-value">0</span>
        </div>
        <div class="stat-block">
          <span class="stat-label">Streak</span>
          <span id="current-streak" class="stat-value">0</span>
        </div>
      </div>

      <div class="progress-track">
        <div id="rank-progress-bar" class="progress-fill"></div>
      </div>
      <div id="rank-progress-label" class="progress-label">--</div>
    </section>

    <section class="card">
      <div class="section-header">
        <h2 class="section-title">Today's Habits</h2>
        <button type="button" id="add-habit-btn" class="btn btn-add">+ Habit</button>
      </div>
      <div id="habit-list" class="item-list"></div>
    </section>

    <section class="card">
      <h2 class="section-title">Today's Tasks</h2>
      <div id="task-list" class="item-list"></div>
    </section>

  </main>

  <div id="modal-root"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
